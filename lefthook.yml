# コミットメッセージ検証（正本: ルール集 harness-ai-rules の rules/language-and-commits.md）
commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-commit:
  jobs:
    # 秘密の混入を commit の前に止める。個人のアカウントの非公開リポジトリでは GitHub の push protection が使えず、ここが唯一の守り。
    # --redact を外すと、見つけた値そのものが端末と記録に残る
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner
