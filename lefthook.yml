# commit の前に動く検査（lefthook）。秘密の検知（gitleaks）と commit の書き方（commitlint）は、個人のリポジトリ全部でそろえている

# コミットメッセージ検証（正本: ルール集 harness-ai-rules の rules/language-and-commits.md）
commit-msg:
  jobs:
    # 依存の要らない 1 行の検査。リリースの自動化が無いので、type と形だけを見れば足りる（commitlint は使わない）
    - name: commit-message
      run: |
        head -1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|improve)(\([^)]+\))?!?: [^ ].*|Merge .+|Revert ".+|(fixup|squash|amend)! .+)$' || { echo "commit の 1 行目は「type(scope): 日本語の subject」にする。type は feat fix docs style refactor perf test build ci chore revert improve（harness-ai-rules の rules/language-and-commits.md）"; exit 1; }

pre-commit:
  jobs:
    # 秘密の混入を commit の前に止める。公開リポジトリなので、漏れると誰でも読める。commit の時点で止める。
    # --redact を外すと、見つけた値そのものが端末と記録に残る
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner
